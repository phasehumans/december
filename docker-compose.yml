x-logging: &default-logging
    driver: 'json-file'
    options:
        max-size: '50m'
        max-file: '3'

services:
    redis:
        image: redis:7-alpine
        container_name: december-redis
        restart: unless-stopped
        env_file:
            - .env.production
        command:
            [
                'sh',
                '-c',
                'redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD:-redis_secure_password}"',
            ]
        volumes:
            - redisdata:/data
        ports:
            - '127.0.0.1:6379:6379'
        healthcheck:
            test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD:-redis_secure_password}" ping']
            interval: 5s
            timeout: 5s
            retries: 5
        logging: *default-logging

    db-migrate:
        image: ghcr.io/phasehumans/december-db-migrate:latest
        build:
            context: .
            dockerfile: Dockerfile
            target: base
        container_name: december-db-migrate
        restart: 'no'
        env_file:
            - .env.production
        working_dir: /app/packages/database
        command: bun run db:deploy
        logging: *default-logging

    server:
        image: ghcr.io/phasehumans/december-server:latest
        build:
            context: .
            dockerfile: Dockerfile
            target: server
        container_name: december-server
        restart: unless-stopped
        depends_on:
            db-migrate:
                condition: service_completed_successfully
            redis:
                condition: service_healthy
        env_file:
            - .env.production
        ports:
            - '4000:4000'
        logging: *default-logging

    worker:
        image: ghcr.io/phasehumans/december-worker:latest
        build:
            context: .
            dockerfile: Dockerfile
            target: worker
        container_name: december-worker
        restart: unless-stopped
        depends_on:
            db-migrate:
                condition: service_completed_successfully
            redis:
                condition: service_healthy
        env_file:
            - .env.production
        logging: *default-logging

volumes:
    redisdata:
