name: 'trydecember'
description: 'Automated AI software engineer for GitHub issues and workflows'
author: 'phasehumans'

inputs:
    prompt:
        description: 'Instruction or task prompt for December'
        required: false
    github_token:
        description: 'GitHub token for interacting with repository'
        required: false
        default: ${{ github.token }}
    model:
        description: "Model name. Leave empty to use the provider's default model (gemini-3.8-flash for Gemini)"
        required: false
    provider:
        description: 'Model provider (gemini, openai, anthropic, openrouter)'
        required: false
        default: 'gemini'
    gemini_api_key:
        description: 'Google Gemini API key for BYOK'
        required: false
    openai_api_key:
        description: 'OpenAI API key for BYOK'
        required: false
    anthropic_api_key:
        description: 'Anthropic API key for BYOK'
        required: false
    openrouter_api_key:
        description: 'OpenRouter API key for BYOK'
        required: false
    branch:
        description: 'Target branch name'
        required: false
    base_branch:
        description: 'Base branch for pull request (default: main)'
        required: false
        default: 'main'
    create_pr:
        description: 'Whether to create a pull request with changes'
        required: false
        default: 'true'
    pr_title:
        description: 'Custom pull request title'
        required: false
    slack_webhook:
        description: 'Optional Slack webhook URL for alerts'
        required: false
    discord_webhook:
        description: 'Optional Discord webhook URL for alerts'
        required: false

runs:
    using: 'composite'
    steps:
        - name: Setup Bun
          uses: oven-sh/setup-bun@v2
          with:
              bun-version: latest
        - name: Run December Action
          shell: bash
          env:
              INPUT_PROMPT: ${{ inputs.prompt }}
              INPUT_GITHUB_TOKEN: ${{ inputs.github_token }}
              INPUT_MODEL: ${{ inputs.model }}
              INPUT_PROVIDER: ${{ inputs.provider }}
              GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
              OPENAI_API_KEY: ${{ inputs.openai_api_key }}
              ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
              OPENROUTER_API_KEY: ${{ inputs.openrouter_api_key }}
              INPUT_BRANCH: ${{ inputs.branch }}
              INPUT_BASE_BRANCH: ${{ inputs.base_branch }}
              INPUT_CREATE_PR: ${{ inputs.create_pr }}
              INPUT_PR_TITLE: ${{ inputs.pr_title }}
              SLACK_WEBHOOK_URL: ${{ inputs.slack_webhook }}
              DISCORD_WEBHOOK_URL: ${{ inputs.discord_webhook }}
              GITHUB_EVENT_PATH: ${{ github.event_path }}
              GITHUB_REPOSITORY: ${{ github.repository }}
          run: |
              bun ${{ github.action_path }}/runner.ts
