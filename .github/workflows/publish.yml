name: Publish CLI to NPM & GitHub Release

on:
    push:
        tags:
            - 'v*'

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install

            - name: Build CLI for Node
              run: cd apps/cli && bun run build

            - name: Setup Node (for publishing)
              uses: actions/setup-node@v4
              with:
                  node-version: '20.x'
                  registry-url: 'https://registry.npmjs.org'

            - name: Publish to NPM
              run: cd apps/cli && npm publish --access public --provenance
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Compile Standalone Linux Binaries
              run: |
                  cd apps/cli
                  bun build ./src/index.ts --compile --target=bun-linux-x64 --outfile=../../december-x86_64-unknown-linux-gnu
                  bun build ./src/index.ts --compile --target=bun-linux-arm64 --outfile=../../december-aarch64-unknown-linux-gnu
                  cd ../..
                  tar -czvf december-x86_64-unknown-linux-gnu.tar.gz december-x86_64-unknown-linux-gnu
                  tar -czvf december-aarch64-unknown-linux-gnu.tar.gz december-aarch64-unknown-linux-gnu

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  generate_release_notes: true
                  files: |
                      december-*.tar.gz
