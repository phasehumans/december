name: Model Catalog Sync Canary

on:
    schedule:
        # Run weekly on Monday at 00:00 UTC
        - cron: '0 0 * * 1'
    workflow_dispatch:

jobs:
    sync-models:
        name: Check and Sync Live Models
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Generate Prisma Client
              run: bun db:generate

            # no provider keys in ci: which models exist comes from each user's own key (d1).
            # this job reads only public model lists and models.dev (mit) for model details.
            - name: Sync model catalog from public model lists
              run: |
                  set -o pipefail
                  bun scripts/model-parity.ts --apply --no-subscriptions --json "$RUNNER_TEMP/parity.json" | tee "$RUNNER_TEMP/parity.md"
                  bun scripts/model-parity.ts --validate

            - name: Sync model details from models.dev
              run: bun scripts/sync-model-metadata.ts

            - name: Check for model catalog changes
              id: git-diff
              run: |
                  git diff --quiet packages/providers/src/model-catalog.json packages/providers/src/model-metadata.json || echo "changed=true" >> "$GITHUB_OUTPUT"

            - name: Create Pull Request if models updated
              if: steps.git-diff.outputs.changed == 'true'
              uses: peter-evans/create-pull-request@v6
              env:
                  HUSKY: '0'
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  commit-message: 'chore(models): auto-sync provider models and context windows'
                  title: 'chore(models): auto-sync provider models and context windows'
                  body-path: ${{ runner.temp }}/parity.md
                  add-paths: |
                      packages/providers/src/model-catalog.json
                      packages/providers/src/model-metadata.json
                  branch: 'auto-sync-models'
                  delete-branch: true
